<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Topics</title>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('ex-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<style>
  /* generated by scripts/build_index.py from assets/index.html; tokens mirror assets/explainer.css */
  :root {
    --ex-sans: "Public Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --bg: #ffffff; --bg-soft: #f8fafc; --bg-muted: #f1f5f9; --line: #e2e8f0; --line-strong: #cbd5e1;
    --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --accent: #047857; --accent-mark: #10b981; --accent-soft: #ecfdf5;
    color-scheme: light;
  }
  .dark {
    --bg: #020617; --bg-soft: #0a1122; --bg-muted: #111a2e; --line: #1e293b; --line-strong: #334155;
    --ink: #e2e8f0; --ink-2: #cbd5e1; --muted: #94a3b8; --accent: #34d399; --accent-mark: #34d399; --accent-soft: rgb(52 211 153 / 0.1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ex-sans); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [v-cloak] { display: none; }
  .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { color: var(--ink); background: var(--bg-muted); }
  main { max-width: 1120px; margin: 0 auto; padding: 56px 32px 96px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { margin: 0 0 6px; font-size: 36px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; }
  .lead { margin: 0 0 36px; color: var(--muted); font-size: 15.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); scroll-margin-top: 24px; }
  .card:target { border-color: var(--accent-mark); }
  .card h2 { margin: 0; font-size: 19px; line-height: 1.4; font-weight: 600; }
  .card h2 a { color: var(--ink); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); }
  .card p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.75; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .nodes { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  .nodes li a, .nodes li span.pending { display: inline-flex; align-items: center; gap: 7px; padding: 3px 0; }
  .nodes a { color: var(--accent); text-decoration: none; }
  .nodes a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .nodes a svg { color: var(--accent); }
  .nodes .pending { color: var(--muted); }
  .nodes .pending svg { color: var(--line-strong); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: auto; padding-top: 6px; font-size: 13.5px; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .empty { padding: 48px 24px; border: 1px dashed var(--line-strong); border-radius: 12px; color: var(--muted); text-align: center; }
  @media (max-width: 640px) { main { padding-left: 16px; padding-right: 16px; } h1 { font-size: 30px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app" v-cloak>
  <main>
    <div class="title-row">
      <h1>All Topics</h1>
        <button class="icon-btn" type="button" @click="toggle" :aria-label="dark ? '切換到亮色模式' : '切換到暗色模式'">
        <svg v-if="dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg v-else width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
    <p class="lead">{{ topics.length }} 個主題 · {{ pageCount }} 頁</p>
    <div v-if="topics.length" class="grid">
      <article v-for="t in topics" :key="t.folder" class="card" :id="t.folder">
        <h2><a :href="t.href">{{ t.title }}</a></h2>
        <p v-if="t.summary">{{ t.summary }}</p>
        <ul v-if="t.nodes.length > 1" class="nodes" aria-label="這棵樹的頁面">
          <li v-for="(n, i) in t.nodes.slice(1)" :key="i" :style="{ paddingLeft: ((n.d - 1) * 16) + 'px' }">
            <a v-if="n.href" :href="n.href"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>{{ n.t }}</a>
            <span v-else class="pending" title="Not yet expanded"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.1 2.18a10 10 0 0 1 3.8 0"/><path d="M13.9 21.82a10 10 0 0 1-3.8 0"/><path d="M17.61 3.72a10 10 0 0 1 2.69 2.7"/><path d="M2.18 13.9a10 10 0 0 1 0-3.8"/><path d="M20.28 17.61a10 10 0 0 1-2.7 2.69"/><path d="M21.82 10.1a10 10 0 0 1 0 3.8"/><path d="M3.72 6.39a10 10 0 0 1 2.7-2.69"/><path d="M6.39 20.28a10 10 0 0 1-2.69-2.7"/></svg>{{ n.t }}<span class="sr">(Not yet expanded)</span></span>
          </li>
        </ul>
        <div class="meta">
          <span>{{ t.pages }} 頁</span>
          <span v-if="t.uses.length">用到：<template v-for="(u, i) in t.uses" :key="u"><span v-if="i">、</span><a :href="'#' + u">{{ name(u) }}</a></template></span>
          <span v-if="t.usedBy.length">被用到：<template v-for="(u, i) in t.usedBy" :key="u"><span v-if="i">、</span><a :href="'#' + u">{{ name(u) }}</a></template></span>
        </div>
      </article>
    </div>
    <p v-else class="empty">還沒有任何主題。</p>
  </main>
</div>
<script type="application/json" id="ex-index">[
 {
  "folder": "urp-water",
  "title": "URP Waterbody",
  "href": "urp-water/urp-water.html",
  "summary": "Unity 的兩條 render pipeline (渲染管線：把場景畫成畫面的流程) 裡，HDRP (High Definition Render Pipeline，追求高畫質) 有內建的水體系統，URP (Universal Render Pipeline，效能取向、跨平台…",
  "nodes": [
   {
    "t": "URP Waterbody",
    "href": "urp-water/urp-water.html",
    "d": 0
   },
   {
    "t": "1 Vector Math",

   {

    "d": 1,

   }
  ],
  "pages": 17,
  "uses": [],
  "usedBy": []
 }
]</script>
<script>
  const topics = JSON.parse(document.getElementById('ex-index').textContent);
  Vue.createApp({
    data: () => ({ topics, dark: document.documentElement.classList.contains('dark') }),
    computed: { pageCount() { return topics.reduce((n, t) => n + t.pages, 0); } },
    methods: {
      name(folder) { const t = topics.find((x) => x.folder === folder); return t ? t.title : folder; },
      toggle() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        try { localStorage.setItem('ex-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
    },
  }).mount('#app');
</script>
</body>
</html>
