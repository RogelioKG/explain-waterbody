<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Probe Blending 關與開，船上的反射差在哪</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1 class="entry">關：整個物件一張；開：逐像素混</h1>

  <main class="stage card">
    <div class="row-head">
      <span class="mode">Probe Blending <b>關</b></span>
      <span class="read" aria-live="polite">整艘用 <span id="r-off"></span></span>
    </div>
    <div class="strip"><canvas id="cv-off" role="img" aria-label="俯視圖：Probe Blending 關，整艘船只用一張 cubemap"></canvas></div>

    <div class="row-head">
      <span class="mode">Probe Blending <b>開</b></span>
      <span class="read">船上混了 <span id="r-on"></span></span>
    </div>
    <div class="strip"><canvas id="cv-on" role="img" aria-label="俯視圖：Probe Blending 開，船上每個像素各自混合探針與天空盒"></canvas></div>

    <div class="slider"><input type="range" id="in-x" aria-label="船的位置" min="-2" max="58" step="0.5" value="29" /></div>
    <div class="ctl">
      <label for="in-x">船的位置</label><output id="o-x" for="in-x"></output>
      <span class="cap">俯視，畫面寬 72 m</span>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
