<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>陡度與收斂速度</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <div class="titles">
      <h1>陡度與收斂速度</h1>
      <p class="concl">陡度越接近 1，收斂越慢</p>
    </div>
    <div class="ctrl card">
      <label class="ctl-name" for="in-s"><i class="dot k-water"></i>陡度 S</label>
      <div class="track">
        <input id="in-s" type="range" class="k-water" min="0" max="1.4" step="0.01" value="0.5" />
        <span class="tick1" aria-hidden="true">1</span>
      </div>
      <output id="o-s" for="in-s">0.50</output>
    </div>
  </header>

  <main class="panels">
    <section class="panel card" aria-label="水面">
      <div class="ph">
        <span class="pt"><i class="dot k-water"></i>水面</span>
        <span class="cap">單一個波 · 波長 6 m · 同比例</span>
      </div>
      <div class="plot" id="wave-plot">
        <canvas id="c-wave" role="img" aria-label="水面剖面、目標點 q、每次猜測的 vertex 落點"></canvas>
        <em id="badge-fold" class="badge" data-overlay hidden>浪峰打結</em>
        <div id="q-handle" class="q-handle k-target" data-overlay role="slider" tabindex="0" aria-label="目標點 q" aria-valuemin="-1.45" aria-valuemax="4.45" aria-valuenow="1" aria-valuetext="1.00 公尺">q = <span id="o-q" class="num">1.00</span> m</div>
      </div>
    </section>

    <section class="panel card" aria-label="每次猜完的偏差">
      <div class="ph">
        <span class="pt"><span><span class="long">每次猜完，</span>落點離 <b class="k-target-t">q</b> 多遠</span></span>
        <span class="readout" aria-live="polite"><span id="o-left-label">4 次後高度差</span> <output id="o-err" class="k-guess-t">1.8 mm</output></span>
      </div>
      <div class="plot">
        <canvas id="c-bars" role="img" aria-label="每次猜測後落點偏差的長條圖，對數刻度"></canvas>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
