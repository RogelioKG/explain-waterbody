<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eye depth 與視線距離：轉頭時的霧</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <p class="concl">霧要用<b class="t-d">視線距離</b>，轉頭才不變</p>
  </header>

  <main class="stage">
    <section class="plan card" aria-label="俯視圖">
      <p class="cap head">俯視<span class="grid-key">格 = 1 m</span></p>
      <div class="plot" id="plan-wrap">
        <canvas id="c-plan" role="img" aria-label="俯視圖：攝影機、視野、一圈離攝影機一樣遠的魚、視線距離 d 與 eye depth z"></canvas>
        <span class="tag t-d" id="l-d" data-overlay>d</span>
        <span class="tag t-z" id="l-z" data-overlay>z</span>
        <span class="tag t-th" id="l-th" data-overlay>θ</span>
        <span class="tag t-iso-d" id="l-isod" data-overlay>d 相同</span>
        <span class="tag t-iso-z" id="l-isoz" data-overlay>z 相同</span>
      </div>
    </section>

    <section class="screens card" aria-label="攝影機畫面">
      <p class="cap head">攝影機畫面<span class="grid-key">清澈度 D = 5 m</span></p>
      <div class="row-head">
        <span class="name"><i class="dot k-d"></i>用視線距離</span>
        <span class="val t-d">d <output id="o-d"></output></span>
        <span class="tau">τ <output id="o-taud"></output></span>
      </div>
      <div class="plot strip"><canvas id="c-screen" role="img" aria-label="攝影機畫面：上半用視線距離 d 算霧，下半用 eye depth z 算霧"></canvas></div>
      <div class="row-head">
        <span class="name"><i class="dot k-z"></i>用 eye depth</span>
        <span class="val t-z">z <output id="o-z"></output></span>
        <span class="tau">τ <output id="o-tauz"></output></span>
        <em class="badge" id="b-ratio" hidden></em>
      </div>
      <div class="plot chart" id="chart-wrap">
        <canvas id="c-chart" role="img" aria-label="透光率 τ 沿畫面橫向的分布：用 d 算是平的，用 z 算往邊緣變大"></canvas>
        <span class="tick" id="t-top" data-overlay></span>
        <span class="tick" id="t-zero" data-overlay>0</span>
        <span class="tag t-d" id="l-cd" data-overlay>用 d</span>
        <span class="tag t-z" id="l-cz" data-overlay>用 z</span>
      </div>
      <div class="axis" aria-hidden="true"><span id="ax-l"></span><span>中央</span><span id="ax-r"></span></div>
    </section>
  </main>

  <section class="controls card" aria-label="參數">
    <label class="ctl" for="s-th"><span><i class="dot k-th"></i><span>轉頭</span><output id="o-th"></output></span>
      <input type="range" id="s-th" class="k-th" aria-label="轉頭：魚偏離攝影機正前方的角度 θ" min="-45.7" max="45.7" step="0.1" value="45.7" /></label>
    <label class="ctl" for="s-r"><span><i class="dot k-d"></i><span>魚的距離</span><output id="o-r"></output></span>
      <input type="range" id="s-r" class="k-d" aria-label="魚離攝影機的距離 d" min="2" max="6" step="0.1" value="4" /></label>
  </section>

  <script src="./script.js"></script>
</body>
</html>
