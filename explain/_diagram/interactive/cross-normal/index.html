<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B × T 垂直水面、朝上</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <p class="concl">B × T 垂直水面、朝上</p>
    <div class="tools">
      <button id="reset" type="button" aria-label="重設視角">重設視角</button>
    </div>
  </header>
  <main class="stage card">
    <div class="plot"><canvas id="cv" tabindex="0" aria-label="3D 水面 h(x, z) = 0.5 sin x + 0.25 sin z，原點有 T = (1, 0.5, 0)、B = (0, 0.25, 1) 兩支切線箭頭，以及垂直水面的 N 箭頭，N 與 T、B 之間各有直角記號；拖曳或用方向鍵旋轉視角"></canvas></div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
