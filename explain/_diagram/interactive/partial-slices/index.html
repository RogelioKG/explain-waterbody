<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>兩個剖面的斜率，就是偏導數</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <p class="concl">兩個剖面的斜率，就是偏導數</p>
    <button id="reset" type="button" aria-label="重設視角">重設視角</button>
  </header>
  <main class="stage card">
    <div class="plot"><canvas id="cv" tabindex="0" aria-label="3D 水面 h(x, z) = 0.5 sin x + 0.25 sin z，z = 0 與 x = 0 兩條剖面交在原點，原點有沿 x 的 T = (1, 0.5, 0) 與沿 z 的 B = (0, 0.25, 1) 兩支箭頭；拖曳或用方向鍵旋轉視角"></canvas></div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
